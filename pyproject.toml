[project]
name = "tuppence"
version = "0.1.0.dev0"
description = "A private AI money coach for UK households. Your statements never leave your machine."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Tuppence contributors" }]
keywords = ["personal-finance", "uk", "budgeting", "local-first", "llm", "self-hosted", "privacy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "fastapi>=0.142",
  "uvicorn>=0.54",
  "httpx>=0.28",
  "pydantic>=2.13",
  "platformdirs>=4.12",
  "argon2-cffi>=25.1.0",
  "keyring>=25.7.0",
  "cryptography>=46",
  # 49.x and 50.x ship no Intel-macOS wheel, so Intel Macs stay on 48.x (which does).
  "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "idna>=3.20",
  "pyyaml>=6.0.3",
  "openpyxl>=3.1.5",
  "defusedxml>=0.7.1",
  "pdfplumber>=0.11.10",
  "rapidocr>=3.9.2",
  "onnxruntime>=1.23",
  # rapidocr depends on the full opencv-python, which drags in GUI libraries (Qt, FFmpeg);
  # the headless build has the same cv2 module without them (see tool.uv overrides).
  "opencv-python-headless>=4.11",
  "langgraph>=1.2.14",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "python-multipart>=0.0.32",
]

[project.optional-dependencies]
desktop = ["pywebview>=6.2"]

[project.scripts]
tuppence = "tuppence.cli:run"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "types-pyyaml>=6.0.12.20260906",
    "reportlab>=5.0.1",
    "hypothesis>=6.168.5",
]
build = ["pyinstaller>=6.22"]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuppence"]
artifacts = ["src/tuppence/web_dist/**"]

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "src/tuppence/web_dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: builds images/bundles or launches external processes",
  "live: needs a real LLM endpoint (opt-in, never in CI)",
]
addopts = "-m 'not live and not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S603", "S607"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.uv]
override-dependencies = ["opencv-python; sys_platform == 'never'"]
# Wheels must exist for every platform Tuppence ships on (onnxruntime, opencv, pyclipper).
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
