name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  UV_LOCKED: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.ver.outputs.stable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - id: ver
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "stable=true" >> "$GITHUB_OUTPUT"; else echo "stable=false" >> "$GITHUB_OUTPUT"; fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: npm --prefix web ci && npm --prefix web test

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm --prefix web ci && npm --prefix web run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: web_dist, path: src/tuppence/web_dist }

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ${{ needs.test.outputs.stable == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}

  desktop:
    needs: [test, web]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: web_dist, path: src/tuppence/web_dist }
      - run: uv sync --locked --group build --extra desktop
      - run: uv run python scripts/build_desktop.py
      - shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent Tuppence.app "Tuppence-${GITHUB_REF_NAME}-macos.zip";
          elif [ "$RUNNER_OS" = "Windows" ]; then 7z a "Tuppence-${GITHUB_REF_NAME}-windows.zip" Tuppence;
          else tar czf "Tuppence-${GITHUB_REF_NAME}-linux.tar.gz" Tuppence; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "desktop-${{ matrix.os }}", path: "dist/Tuppence-*" }

  release:
    needs: [test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: "desktop-*", merge-multiple: true, path: release-files }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: "release-files/Tuppence-*"
          prerelease: ${{ needs.test.outputs.stable != 'true' }}
