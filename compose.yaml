# Tuppence on a home server. Keep it on your LAN; use a VPN (e.g. Tailscale) for remote access.
# Optional local AI: docker compose --profile ollama up -d
services:
  tuppence:
    image: ghcr.io/szk1234/tuppence:latest
    build: .
    ports:
      - "8040:8040"
    volumes:
      - tuppence-data:/data
    restart: unless-stopped
    # Server-mode hardening (see SECURITY.md). Uncomment and edit:
    # environment:
    #   # Hostnames you use to reach Tuppence (comma-separated); blocks DNS rebinding.
    #   TUPPENCE_ALLOWED_HOSTS: "money.home.lan"
    #   # Only when you reach Tuppence over HTTPS (e.g. behind Caddy): Secure sign-in cookie.
    #   TUPPENCE_SECURE_COOKIES: "1"
    #   # The key that encrypts saved AI keys, kept out of the data volume as a Docker
    #   # secret (create tuppence_secret_key.txt first: see SECURITY.md).
    #   TUPPENCE_SECRET_KEY_FILE: /run/secrets/tuppence_secret_key
    # secrets:
    #   - tuppence_secret_key

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  tuppence-data: {}
  ollama: {}

# Uncomment with TUPPENCE_SECRET_KEY_FILE above:
# secrets:
#   tuppence_secret_key:
#     file: ./tuppence_secret_key.txt
