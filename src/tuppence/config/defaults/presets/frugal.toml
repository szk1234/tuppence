# Least AI use: good for small local models and tight budgets.
[agents.researcher]
enabled = false
[agents.categoriser.budgets]
max_llm_calls = 30
max_gbp = 0.20
[agents.coach.limits]
max_tool_calls_per_turn = 4
[agents.linter.budgets]
max_llm_calls = 5
[agents.reader.limits]
parallel_chunks = 1

[agents.categoriser.limits]
max_rows_per_batch = 15
memory_min_rows = 2
